[project]
name = "replay"
version = "0.1.0"
description = "Broadcast-to-tracking converter and tactical sandbox"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "imageio>=2.34",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.2", "torch>=2.2"]

[project.scripts]
replay = "replay.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: takes more than a few seconds",
    "network: requires network access",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]
